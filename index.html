
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I LOVE YOU ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: radial-gradient(circle, #350018, #10000c);
    font-family: Arial, sans-serif;
}

.container {
    position: relative;
    width: min(90vw, 500px);
    aspect-ratio: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glowing center heart */
.center-heart {
    position: absolute;
    color: #ff1744;
    font-size: clamp(80px, 18vw, 110px);
    animation: heartbeat 1.2s infinite;
    text-shadow:
        0 0 15px #ff1744,
        0 0 35px #ff1744,
        0 0 70px #ff1744;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.15); }
    40% { transform: scale(1); }
    60% { transform: scale(1.2); }
}

.heart-outline {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
}

.heart-outline path {
    fill: none;
    stroke: #ff1744;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.8;
    filter:
        drop-shadow(0 0 5px #ff1744)
        drop-shadow(0 0 12px #ff1744);
}

/* Heart orbit area */
.heart-orbit {
    position: absolute;
    width: 100%;
    height: 100%;
}

/* Moving words */
.word {
    position: absolute;
    color: #ffb6c9;
    font-size: clamp(10px, 2.8vw, 16px);
    font-weight: bold;
    white-space: nowrap;
    text-shadow:
        0 0 8px #ff1744,
        0 0 15px #ff1744,
        0 0 25px #ff1744;
    will-change: transform;
}
</style>
</head>

<body>

<div class="container">

    <div class="center-heart">♥</div>

    <div class="heart-orbit" id="heartOrbit"></div>

</div>

<script>
const orbit = document.getElementById("heartOrbit");

const totalWords = 24;
const words = [];

// Heart mathematical curve
function heartPoint(t, scale) {

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y = -(
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
    );

    return {
        x: x * scale,
        y: y * scale
    };
}

// Create moving words
for (let i = 0; i < totalWords; i++) {

    const word = document.createElement("span");

    word.className = "word";
    word.textContent = "I LOVE YOU ♥";

    orbit.appendChild(word);

    words.push({
        element: word,
        offset: (i / totalWords) * Math.PI * 2
    });
}

// Animation
function animate(time) {

    const width = orbit.clientWidth;
    const height = orbit.clientHeight;

    const scale = Math.min(width / 36, height / 36) * 0.88;

    const speed = 0.00035;
    const movement = time * speed;

    words.forEach((word) => {

        const t = word.offset + movement;

        const point = heartPoint(t, scale);

        word.element.style.left =
            (width / 2 + point.x) + "px";

        word.element.style.top =
            (height / 2 + point.y) + "px";

        word.element.style.transform =
            "translate(-50%, -50%)";

    });

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
